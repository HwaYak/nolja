<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>놀자</title>
  <meta name="description" content="받아 두면 오프라인에서도 열리는 도트 감성 웹 게임·도구 모음">
  <meta name="theme-color" content="#f3f7ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111a30" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="shared/fonts/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared/fonts/galmuri.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="hub/hub.css">
  <script type="module" src="hub/hub.js"></script>
</head>
<body>
  <header class="top">
    <div class="top__inner">
      <a class="logo" href="./" aria-label="놀자 홈"><img class="logo__head" src="icons/favicon.svg" alt="" width="24" height="24">놀자</a>
      <nav id="tabs" class="tabs" aria-label="분류"></nav>
      <div class="memory" title="보관함에 꽂아 둔 카트리지">
        <span class="memory__label">메모리 카드</span>
        <span id="memory-bar" class="memory__bar" aria-hidden="true"></span>
        <span id="memory-text" class="memory__text"></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero__text">
        <div class="stage">
          <button id="mascot" class="mascot is-enter" type="button" aria-label="마스코트에게 말 걸기">
            <span id="mascot-art" class="mascot__art"></span>
            <span class="spark spark--1"></span>
            <span class="spark spark--2"></span>
            <span class="spark spark--3"></span>
          </button>
          <div class="bubble">
            <h1 class="sr-only">오늘은 뭐 하고 놀까?</h1>
            <p id="bubble-text" class="bubble__text" aria-hidden="true">오늘은 뭐 하고 놀까?</p>
            <p id="mascot-say" class="sr-only" aria-live="polite"></p>
          </div>
        </div>
        <p class="hero__lead">카트리지를 꽂아 두면 다음부터 내 기기에서 바로 열리고, 인터넷이 없어도 쓸 수 있어요.</p>
      </div>
      <div class="hero__side">
        <section class="player" aria-label="내 플레이어 카드">
          <div class="player__head">
            <div class="player__who">
              <span class="player__tag">PLAYER 1</span>
              <div id="name-view" class="player__name-row">
                <b id="player-name" class="player__name"></b>
                <button id="name-edit" class="player__edit" type="button" aria-label="이름 바꾸기" title="이름 바꾸기"><i data-icon="pencil"></i></button>
              </div>
              <form id="name-form" class="player__form" hidden>
                <label class="sr-only" for="name-input">이름</label>
                <input id="name-input" type="text" maxlength="12" autocomplete="off" placeholder="이름 (12자까지)">
                <button class="pbtn pbtn--blue" type="submit">저장</button>
              </form>
            </div>
            <span id="player-level" class="player__level"></span>
          </div>
          <div class="player__stats">
            <div class="stat"><b id="stat-plays">0</b><span>판 플레이</span></div>
            <div class="stat"><b id="stat-time">0분</b><span>플레이 시간</span></div>
            <div class="stat"><b id="stat-carts">0</b><span>꽂은 카트리지</span></div>
          </div>
        </section>
        <div class="hero__actions">
          <span id="net" class="net"></span>
          <button id="random" class="pbtn pbtn--yellow" type="button"><i data-icon="dice"></i>랜덤 플레이</button>
        </div>
      </div>
    </section>

    <div class="toolbar">
      <label class="search">
        <i data-icon="search"></i>
        <span class="sr-only">검색</span>
        <input id="search" type="search" placeholder="카트리지 찾기" autocomplete="off">
      </label>
      <button id="install" class="pbtn" type="button" hidden><i data-icon="download"></i>앱 설치</button>
    </div>

    <p id="message" class="empty" hidden></p>
    <ul id="shelf" class="shelf" aria-live="polite"></ul>

    <section id="records" class="records" aria-labelledby="records-title" hidden>
      <div class="records__head">
        <h2 id="records-title" class="records__title">세이브 기록 · <span id="records-name"></span></h2>
        <span id="records-count" class="records__count"></span>
      </div>
      <ol id="slots" class="slots"></ol>
      <div class="records__foot">
        <p class="records__note">기록은 이 브라우저에만 저장돼요. 다른 기기로 옮기려면 세이브를 내보내서 거기서 가져오세요.</p>
        <div class="records__actions">
          <button id="save-export" class="pbtn" type="button"><i data-icon="download"></i>세이브 내보내기</button>
          <button id="save-import" class="pbtn" type="button"><i data-icon="upload"></i>세이브 가져오기</button>
          <input id="save-file" type="file" accept=".json,application/json" hidden>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>놀자 · <a href="https://github.com/HwaYak/nolja">GitHub</a> · 글꼴 <a href="https://github.com/quiple/galmuri">갈무리</a></p>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <template id="cart">
    <li class="cart">
      <div class="cart__head">
        <span class="kind"></span>
        <span class="state"></span>
      </div>
      <a class="cart__label" data-play tabindex="-1">
        <img alt="" loading="lazy">
      </a>
      <h2 class="cart__title"></h2>
      <p class="cart__desc"></p>
      <p class="cart__meta"></p>
      <p class="cart__record" hidden></p>
      <div class="gauge" hidden></div>
      <div class="cart__actions">
        <a class="pbtn pbtn--blue" data-play><i data-icon="play"></i>플레이</a>
        <button class="pbtn" type="button" data-download><i data-icon="download"></i><span data-label>꽂기</span></button>
        <button class="pbtn pbtn--icon" type="button" data-remove title="빼기 (받아 둔 파일 삭제)" aria-label="카트리지 빼기" hidden><i data-icon="eject"></i></button>
      </div>
    </li>
  </template>
</body>
</html>
