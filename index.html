<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>놀자</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #fffaf0;
      color: #222;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16141a; color: #eee; }
    }
    main { text-align: center; padding: 16px; }
    h1 { font-size: clamp(2.5rem, 10vw, 5rem); margin: 0; }
    p { opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>놀자</h1>
    <p>게임 준비 중입니다.</p>
  </main>
</body>
</html>
